name: CI + Deploy (dev only)

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BASE_URL: http://localhost:8080

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --exclude .git,__pycache__,.venv,venv,build,dist,logs,tests,**/__init__.py \
            --extend-exclude requirements.txt \
            --max-line-length=100

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose build & up
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for API healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${BASE_URL}/docs" > /dev/null; then exit 0; fi
            echo "Waiting API..."; sleep 2
          done
          docker compose logs --tail=200
          exit 1

      - name: Install test deps
        run: |
          pip install pytest pytest-cov requests

      - name: Run tests
        run: |
          pytest tests/test_substructure_integration.py -q --maxfail=3 --cov=.

  build-and-push-dev:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha

      - name: Build and push (:dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-and-push-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sanity: show workspace
        run: |
          pwd
          ls -la
          echo "--- deploy dir ---"
          ls -la deploy || true
          test -f ./deploy/compose.yml
          test -f ./deploy/nginx.conf

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure target dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eux
            mkdir -p /home/anton/app/deploy
            ls -la /home/anton/app/deploy

      - name: Copy deploy files (compose.yml + nginx.conf)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./deploy/compose.yml,./deploy/nginx.conf
          target: /home/anton/app/deploy
          overwrite: true
          debug: true

      - name: Deploy (pull & up -d)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<'EOF'
          set -euxo pipefail
          cd ~/app/deploy
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull api celery_worker
          docker compose up -d db redis api celery_worker nginx
          docker image prune -f
          EOF
