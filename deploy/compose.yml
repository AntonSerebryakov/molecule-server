services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mols_dev
      POSTGRES_USER: mols_dev
      POSTGRES_PASSWORD: mols_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mols_dev -d mols_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/antonserebryakov/molecule-server:dev
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8080:8080"
    
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    volumes:
      - logsdata:/app/logs
    restart: on-failure

  celery_worker:
    image: ghcr.io/antonserebryakov/molecule-server:dev
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A celery_worker.celery worker --loglevel=info
    volumes:
      - logsdata:/app/logs
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  logsdata:
